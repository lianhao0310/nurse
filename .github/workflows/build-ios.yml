name: Build iOS IPA

# 在 GitHub 的 macOS runner 上把 Capacitor iOS 工程编译为 .ipa
# 触发：推送到 master/main、打 tag（v*）、或手动触发
# 打 tag 时额外创建 GitHub Release 并上传 IPA（Gitee 镜像同步 tag 即可触发）
#
# 说明：GitHub Actions 的 `if:` 条件不允许直接引用 secrets 上下文，
# 因此这里在 job 级 env 把 IOS_CERTIFICATE 映射为 SIGN_CERT，
# 各步骤的 if 统一使用 env.SIGN_CERT。
on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      SIGN_CERT: ${{ secrets.IOS_CERTIFICATE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm install

      - name: Ensure CocoaPods
        run: |
          which pod || sudo gem install cocoapods
          pod --version

      # 复制前端静态资源到 iOS 工程，并 pod install（macOS 自带 CocoaPods）
      - name: Capacitor sync (web assets + pods)
        run: npx cap sync ios

      # cap sync 会重写原生 Info.plist 并清掉手动添加的权限键，这里在编译前重新注入
      - name: Inject privacy usage descriptions
        run: |
          PLIST=ios/App/App/Info.plist
          add_key() {
            /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST" >/dev/null 2>&1 \
              && /usr/libexec/PlistBuddy -c "Set :$1 \"$2\"" "$PLIST" \
              || /usr/libexec/PlistBuddy -c "Add :$1 string \"$2\"" "$PLIST"
          }
          add_key NSMicrophoneUsageDescription "用于录音记录门诊问诊内容"
          add_key NSSpeechRecognitionUsageDescription "用于将门诊录音实时转写为文字，便于生成用药与待办"
          add_key NSPhotoLibraryUsageDescription "用于选择检查报告、处方等图片进行归档与 AI 识别"
          add_key NSPhotoLibraryAddUsageDescription "用于将归档的图片保存到相册"
          add_key NSCameraUsageDescription "用于拍摄检查报告、处方等图片"
          echo "--- 注入后的权限键 ---"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | grep -i UsageDescription || true

      # ---------- 可选：签名（未配置密钥时仅产出未签名 xcarchive 供检视） ----------
      - name: Decode signing assets
        if: ${{ env.SIGN_CERT != '' }}
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          APP_CERT_PATH=$RUNNER_TEMP/cert.p12
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$IOS_CERTIFICATE" | base64 --decode > "$APP_CERT_PATH"
          echo -n "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PP_PATH"

          KEYCHAIN_PATH=$RUNNER_TEMP/app-sign.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$APP_CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S utool: -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/bin/plutil -extract UUID xml1 -o - "$PP_PATH" | tr -d '\n' | sed -e 's/.*<string>\(.*\)<\/string>.*/\1/')
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID.mobileprovision"

      - name: Write export options plist
        if: ${{ env.SIGN_CERT != '' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD || 'ad-hoc' }}
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Build & archive (signed)
        if: ${{ env.SIGN_CERT != '' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            clean archive | xcpretty || xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=manual CODE_SIGN_IDENTITY="iPhone Distribution" clean archive

      - name: Export IPA (signed)
        if: ${{ env.SIGN_CERT != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/ipa"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"
          ls -la "$RUNNER_TEMP/ipa"

      # 未配置签名密钥时：无签名归档，并手动将 .app 打包为 .ipa
      # （未签名 .ipa 无法安装到设备，仅供下载检视；配置签名后会导出可安装包）
      - name: Build archive & package IPA (unsigned)
        if: ${{ env.SIGN_CERT == '' }}
        run: |
          echo "::warning::未配置 iOS 签名密钥（IOS_CERTIFICATE 等），将生成未签名 .ipa，无法安装到设备。请在仓库 Secrets 中配置签名证书与描述文件后重新运行以获得可安装包。"
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            clean archive
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -r "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -r nurse.ipa Payload
          ls -la "$RUNNER_TEMP/ipa"

      # 无论是否签名，构建成功即上传 .ipa 产物（供本机自动下载）
      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nurse-ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 90

      # 打 tag 触发时：创建 GitHub Release 并上传 IPA
      - name: Upload IPA to Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release create "$TAG" --title "$TAG" --generate-notes || true
          IPAS=$(ls "$RUNNER_TEMP"/ipa/*.ipa 2>/dev/null || true)
          if [ -n "$IPAS" ]; then
            gh release upload "$TAG" $IPAS --clobber
          fi
